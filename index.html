  :root{
    --bg:#000000; --bg2:#000000; --row:#202020; --line:#202020;
    --text:#fff; --muted:#8a8a8a; --dim:#5a5a5a;
    --accent:#fff;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Bebas Neue","Avenir Next Condensed","Arial Narrow",sans-serif;
    font-weight:400;text-transform:uppercase;letter-spacing:.03em}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;text-transform:inherit;cursor:pointer}
  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}

  /* ===== TIMER SCREEN ===== */
  #timer .top{position:absolute;left:0;right:0;top:0;z-index:2;padding:calc(var(--sat) + 14px) 20px 0;display:flex;align-items:center;justify-content:space-between;color:#fff}
  .rounds{position:absolute;left:0;right:0;bottom:calc(50% + min(19.5vw,17.8vh) + 12px);text-align:center;font-size:36px;line-height:1.15;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 20px;white-space:nowrap}
  .gearbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff}
  .gearbtn svg{width:30px;height:30px}
  #stage{flex:1;position:relative;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .25s}
  #stage .big{font-size:min(46vw,42vh);line-height:1;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  #stage .label{position:absolute;left:0;right:0;top:calc(50% + min(16.5vw,15vh) + 12px);text-align:center;font-size:36px;line-height:1;color:var(--muted)}
  #timer .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(var(--sab) + 30px);display:flex;align-items:center;justify-content:space-between}
  .ctl{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
  .ctl::after{content:"";position:absolute;inset:8px;border:4px solid #000000;border-radius:50%}
  .ctl svg{position:relative;width:60px;height:60px}
  .ctl{background:#fff} #startbtn svg{color:#000}
  #resetBtn svg{color:#000}

  /* ===== SETTINGS SCREEN ===== */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 12px) 20px 14px;font-size:24px;background:var(--bg);flex-shrink:0}
  .nav .cancel{color:#fff;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-12px} .nav .cancel svg{width:30px;height:30px} .nav .spacer{width:44px;height:44px;margin-right:-12px} .nav .title{color:#fff;font-size:36px;line-height:1}
  .namehead{padding:16px 20px}
  .namehead input{display:block;width:100%;background:transparent;border:0;color:#fff;font:inherit;font-size:46px;text-align:center;text-transform:uppercase;outline:none;padding:6px 0;border-bottom:1px dashed var(--dim)}
  .namehead input::placeholder{color:var(--dim)}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sab) + 120px)}
  .sechead{background:transparent;color:#fff;text-align:center;font-size:46px;line-height:1;padding:22px 20px;position:relative}
  .row{display:flex;align-items:center;width:100%;text-align:left;padding:16px 10px 16px 20px;border-bottom:1px solid var(--line);min-height:88px}
  .row .dot{display:none}
  .row .txt{flex:1}
  .row .txt .t{font-size:46px;line-height:1}
  .row .val{font-size:46px;font-variant-numeric:tabular-nums;line-height:1;margin-right:12px}
  .row .chev{color:var(--muted);display:flex;margin-right:6px} .row .chev svg{width:28px;height:28px}
  .actions{display:flex;gap:14px;margin:30px 20px 20px}
  .addbtn{flex:1;display:flex;align-items:center;justify-content:center;background:#202020;border-radius:999px;padding:16px;font-size:28px}
  .addbtn.on{background:#fff;color:#000}
  .wk{display:block;padding:18px 20px;border-bottom:1px solid var(--line)}
  .wk .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .wk .name{color:#fff;font-size:46px;line-height:1;flex:1}
  .wk .grid{display:grid;grid-template-columns:1fr auto;gap:6px 20px;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
  .wk .grid span:nth-child(even){text-align:right}
  .wk .check{width:52px;height:52px;border-radius:50%;background:#202020;display:flex;align-items:center;justify-content:center;color:#888;flex-shrink:0}
  .wk.sel .check{background:#fff;color:#000}
  .wk .check svg{width:26px;height:26px}
  .wk .del{display:none;width:52px;height:52px;border-radius:50%;background:#fff;color:#000;align-items:center;justify-content:center;flex-shrink:0} .wk .del svg{width:26px;height:26px}
  .deleting .wk .del{display:flex}.deleting .wk .check{display:none}
  .empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:20px}

  /* ===== PICKER SHEET ===== */
  #picker{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
  #picker.on{display:flex}
  .pick{flex:1;display:flex;align-items:center;justify-content:center;gap:16px}
  .wheelwrap{position:relative;height:450px;width:150px}
  .wheelwrap::before{content:"";position:absolute;left:0;right:0;top:50%;height:110px;transform:translateY(-50%);background:#202020;border-radius:999px;pointer-events:none}
  .wheel{position:absolute;inset:0;overflow-y:scroll;-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:170px 0}
  .wheel::-webkit-scrollbar{display:none}
  .wheel div{height:110px;line-height:110px;text-align:center;font-size:96px;color:#fff;scroll-snap-align:center;font-variant-numeric:tabular-nums;opacity:.18;transform:scale(.72);transition:opacity .12s,transform .12s}
  .wheel div.near{opacity:.4;transform:scale(.85)}
  .wheel div.sel{opacity:1;transform:none}
  .pick .unit{font-size:46px;color:var(--muted);margin-right:28px;align-self:center}
  .swatches{display:none!important}
  .swatches div{flex:1;display:flex;align-items:center;justify-content:center;color:#000}
  .swatches svg{width:40px;height:40px;display:none}
  .swatches div.on svg{display:block}
  .hide{display:none!important}
</style>
</head>

    <button class="ctl" id="startbtn" aria-label="Start"><svg viewBox="0 0 256 256" fill="currentColor" id="playIco"><path d="M234.49,111.07,90.41,22.94A20,20,0,0,0,60,39.87V216.13a20,20,0,0,0,30.41,16.93l144.08-88.13a19.82,19.82,0,0,0,0-33.86ZM84,208.85V47.15L216.16,128Z"/></svg><svg viewBox="0 0 256 256" fill="currentColor" id="pauseIco" class="hide"><path d="M200,28H160a20,20,0,0,0-20,20V208a20,20,0,0,0,20,20h40a20,20,0,0,0,20-20V48A20,20,0,0,0,200,28Zm-4,176H164V52h32ZM96,28H56A20,20,0,0,0,36,48V208a20,20,0,0,0,20,20H96a20,20,0,0,0,20-20V48A20,20,0,0,0,96,28ZM92,204H60V52H92Z"/></svg></button>
  </div>
</div>

<!-- ================= SETTINGS ================= -->
<div id="settings" class="screen">
  <div class="nav">
    <button class="cancel" id="cancelBtn" aria-label="Back"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"/></svg></button>
    <div class="title"></div>
    <div class="spacer"></div>
  </div>
  <div class="scroll" id="scroll">
    <div class="sechead namehead"><input id="nameInput" placeholder="Timer name" maxlength="22"></div>
    <div id="rows" style="margin-bottom:30px"></div>
    <div class="sechead">Timers</div>
    <div id="wkList"></div>
    <div class="actions">
      <button class="addbtn" id="editBtn">Edit Timers</button>
      <button class="addbtn" id="addBtn">Add New Timer</button>
    </div>
  </div>
</div>

<!-- ================= PICKER ================= -->
<div id="picker">
  <div class="nav">
    <button class="cancel" id="pBack" aria-label="Back"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"/></svg></button>
    <div class="title" id="pTitle">Work</div>
    <div class="spacer"></div>
  </div>
  <div class="pick" id="pickTime">
    <div class="wheelwrap"><div class="wheel" id="selMin"></div></div><div class="unit">Min</div>
    <div class="wheelwrap"><div class="wheel" id="selSec"></div></div><div class="unit">Sec</div>
  </div>
  <div class="pick hide" id="pickRounds">
    <div class="wheelwrap"><div class="wheel" id="selRounds"></div></div><div class="unit">Rounds</div>
  </div>
  <div class="swatches" id="swatches"></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const COLORS = {};
  const FIELDS = [
    {key:'work',    title:'Work',    type:'time'},
    {key:'rest',    title:'Rest',    type:'time'},
    {key:'rounds',  title:'Rounds',  type:'rounds'},
  ];
  const DEFAULTS = [
    {id:'d1', name:'Bag Training', work:120, rest:50, rounds:20, colors:{work:'green',rest:'red'}},
    {id:'d2', name:'Strength Training', work:17, rest:0, rounds:40, colors:{work:'green',rest:'red'}},
    {id:'d3', name:'Sparring', work:120, rest:10, rounds:20, colors:{work:'green',rest:'red'}},
    {id:'d4', name:'Drills', work:30, rest:0, rounds:20, colors:{work:'green',rest:'red'}},
  ];

  /* ---------- storage ---------- */
  let store = load();
  function load(){
    try{ const s = JSON.parse(localStorage.getItem('roundsTimer.v4')); if(s && s.workouts && s.workouts.length) return s; }catch(e){}
    return {workouts:JSON.parse(JSON.stringify(DEFAULTS)), currentId:'d1'};
  }
  function persist(){ try{ localStorage.setItem('roundsTimer.v4', JSON.stringify(store)); }catch(e){} }
  const current = () => store.workouts.find(w=>w.id===store.currentId) || store.workouts[0];

  /* ---------- helpers ---------- */
  const pad = n => String(n).padStart(2,'0');
  const mmss = s => { s=Math.max(0,Math.ceil(s)); return pad(Math.floor(s/60))+':'+pad(s%60); };
  const short = s => s>=60 ? (Math.floor(s/60)+':'+pad(s%60)) : (':'+pad(s));
  const totalLen = w => w.rounds*w.work + Math.max(0,w.rounds-1)*w.rest;

  /* ---------- audio: Web Audio for precise timing + silent <audio> loop to keep iOS in "playback" mode ---------- */
  let ctx=null;
  function unlockAudio(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ctx && ctx.state==='suspended') ctx.resume();
  }
  function tone(t, freq, dur, vol, type='sine', detune=0){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq; o.detune.value=detune; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.003); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
    o.start(t); o.stop(t+dur+.05);
  }
  function noise(t, dur, vol, freq, q){ // short filtered noise burst = the "strike"
    const n=Math.ceil(ctx.sampleRate*dur), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1);
    const src=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=b; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
    src.start(t); src.stop(t+dur+.02);
  }
  // Woodblock: dry, short "tok" — a quickly decaying tone plus a click
  function woodblock(t){
    if(!ctx) return;
    // deeper fundamental, fast pitch drop for the "knock", bright transient click for sharpness
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='square'; o.frequency.setValueAtTime(1150,t); o.frequency.exponentialRampToValueAtTime(820,t+.015);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.55,t+.0015); g.gain.exponentialRampToValueAtTime(.0005,t+.06);
    o.start(t); o.stop(t+.1);
    tone(t,2300,.035,.3,'sine'); noise(t,.03,1,2400,3); noise(t,.01,.7,6000,.7);
  }
  // Boxing bell: inharmonic metallic partials with a long ring
  function bellStrike(t, vol=1){
    if(!ctx) return;
    // higher, brighter ring: upper partials carry more weight and sustain longer
    const f0=740, partials=[[1,.9,3.0],[2.0,.7,2.6],[2.76,.6,2.3],[3.52,.45,2.0],[4.07,.35,1.7],[5.4,.25,1.3],[6.8,.15,1.0]];
    for(const [r,a,d] of partials){ tone(t,f0*r,d,.3*a*vol,'sine',5); tone(t,f0*r,d*.9,.22*a*vol,'sine',-5); }
    noise(t,.05,.9*vol,5000,.6);
  }
  const tick       = t => woodblock(t);
  const bell       = t => bellStrike(t);
  const finishBell = t => { bellStrike(t); bellStrike(t+.55); bellStrike(t+1.1,1.1); };
  const now = () => ctx ? ctx.currentTime : 0;

  // NOTE: no background <audio> element on purpose — Web Audio alone mixes with music from other apps
  // (an <audio> element would make iOS pause the user's music). Sounds therefore follow the ring/silent switch.

  /* ---------- wake lock ---------- */
  let wakeLock=null;
  async function keepAwake(on){
    try{
      if(on && 'wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }
      else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && T.running) keepAwake(true); });

  /* ---------- timer engine ---------- */
  const T = {phases:[], idx:0, running:false, endAt:0, remaining:0, raf:null, lastWhole:null};
  function buildPhases(w){
    const p=[];
    for(let r=1;r<=w.rounds;r++){
      p.push({name:'Work', len:w.work, color:w.colors.work, round:r});
      if(w.rest>0 && r<w.rounds) p.push({name:'Rest', len:w.rest, color:w.colors.rest, round:r});
    }
    return p;
  }
  function resetTimer(){
    T.running=false; cancelAnimationFrame(T.raf); keepAwake(false);
    T.phases=buildPhases(current()); T.idx=0; T.remaining=T.phases.length?T.phases[0].len:0; T.lastWhole=null; T.lastCue=null;
    render(true);
  }
  function start(){
    if(!T.phases.length) return;
    if(T.idx>=T.phases.length){ T.idx=0; T.remaining=T.phases[0].len; }
    unlockAudio(); keepAwake(true);
    T.running=true; T.endAt=performance.now()+T.remaining*1000; T.lastCue=Math.ceil(T.remaining-LEAD);
    loop(); render(true);
  }
  function pause(){ T.running=false; cancelAnimationFrame(T.raf); T.remaining=Math.max(0,(T.endAt-performance.now())/1000); keepAwake(false); render(true); }
  const LEAD=0.25; // seconds of look-ahead: sounds are scheduled on the audio clock so they land exactly on the second
  function loop(){
    if(!T.running) return;
    T.remaining=(T.endAt-performance.now())/1000;
    if(T.remaining<=0){ nextPhase(true); return; }
    const cue=Math.ceil(T.remaining-LEAD);
    if(cue!==T.lastCue){
      T.lastCue=cue; const len=T.phases[T.idx].len;
      const at=now()+Math.max(0,T.remaining-cue); // exact moment the display will read "cue"
      if(cue===0){ if(T.idx+1<T.phases.length) bell(at); else finishBell(at); }
      else if(cue<=3 && len>3) tick(at);
    }
    const whole=Math.ceil(T.remaining);
    if(whole!==T.lastWhole){ T.lastWhole=whole; render(); }
    T.raf=requestAnimationFrame(loop);
  }
  function nextPhase(auto){
    if(!auto){ if(T.idx+1<T.phases.length) bell(now()); else finishBell(now()); }
    T.idx++;
    if(T.idx>=T.phases.length){ T.running=false; T.remaining=0; keepAwake(false); render(true); return; }
    T.remaining=T.phases[T.idx].len; T.lastWhole=null; T.lastCue=null;
    if(T.running){ T.endAt=performance.now()+T.remaining*1000; T.raf=requestAnimationFrame(loop); }
    render(true);
  }
  function render(full){
    const w=current(), ph=T.phases[T.idx], done=T.idx>=T.phases.length;
    $('big').textContent = mmss(T.remaining);
    if(full){
      const stage=$('stage');
      $('hName').textContent = w.name || 'Rounds';
      if(done){ $('phaseName').textContent='Finished'; $('big').textContent='00:00'; }
      else { $('phaseName').textContent=ph.name; }
      $('playIco').classList.toggle('hide',T.running); $('pauseIco').classList.toggle('hide',!T.running);
    }
    // rounds left (work phases remaining incl. current)
    let left=0; for(let i=T.idx;i<T.phases.length;i++) if(T.phases[i].name==='Work') left++;
    $('roundsLeft').textContent=left;
  }
  $('startbtn').onclick=()=> T.running?pause():start();
  $('stage').onclick=()=>{ if(T.running) pause(); else if(T.idx<T.phases.length) start(); };
  $('resetBtn').onclick=resetTimer;

  /* ---------- settings screen ---------- */
  let draft=null, deleting=false;
  function openSettings(){
    if(T.running) pause();
    draft=JSON.parse(JSON.stringify(current())); dirty=false;
    deleting=false; $('editBtn').classList.remove('on'); $('editBtn').textContent='Edit Timers'; $('wkList').classList.remove('deleting');
    renderSettings();
    $('timer').classList.remove('on'); $('settings').classList.add('on');
  }
  function closeSettings(){ $('settings').classList.remove('on'); $('timer').classList.add('on'); resetTimer(); }
  function renderSettings(){
    $('nameInput').value=draft.name;
    $('rows').innerHTML=FIELDS.map(f=>{
      const val = f.type==='rounds' ? draft.rounds : short(draft[f.key]);
      return `<button class="row" data-key="${f.key}"><span class="txt"><div class="t">${f.title}</div></span><span class="val">${val}</span><span class="chev"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M184.49,136.49l-80,80a12,12,0,0,1-17-17L159,128,87.51,56.49a12,12,0,1,1,17-17l80,80A12,12,0,0,1,184.49,136.49Z"/></svg></span></button>`;
    }).join('');
    $('rows').querySelectorAll('.row').forEach(b=> b.onclick=()=>openPicker(b.dataset.key));
    renderWorkouts();
  }
  function renderWorkouts(){
    const list=$('wkList'); list.classList.toggle('deleting',deleting);
    if(!store.workouts.length){ list.innerHTML='<div class="empty">No saved workouts yet</div>'; return; }
    list.innerHTML=store.workouts.map(w=>`
      <div class="wk ${w.id===store.currentId?'sel':''}" data-id="${w.id}">
        <div class="head">
          <div class="name">${esc(w.name)}</div>
          <button class="check" aria-label="Select"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"/></svg></button>
          <button class="del" aria-label="Delete"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/></svg></button>
        </div>
        <div class="grid info">
          <span>Work</span><span>${short(w.work)}</span>
          <span>Rest</span><span>${short(w.rest)}</span>
          <span>Rounds</span><span>${w.rounds}</span>
        </div>
      </div>`).join('');
    list.querySelectorAll('.wk').forEach(el=>{
      const id=el.dataset.id;
      el.querySelector('.info').onclick=()=>selectWorkout(id);
      el.querySelector('.name').onclick=()=>selectWorkout(id);
      el.querySelector('.check').onclick=()=>selectWorkout(id);
      el.querySelector('.del').onclick=()=>{ if(confirm('Delete this workout?')){ store.workouts=store.workouts.filter(w=>w.id!==id); if(store.currentId===id) store.currentId=store.workouts[0]?store.workouts[0].id:null; persist(); if(current()) draft=JSON.parse(JSON.stringify(current())); renderSettings(); } };
    });
  }
  function selectWorkout(id){ commitDraft(); store.currentId=id; persist(); draft=JSON.parse(JSON.stringify(current())); renderSettings(); $('scroll').scrollTo({top:0,behavior:'smooth'}); }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  $('nameInput').oninput=e=>{ draft.name=e.target.value; dirty=true; };
  $('nameInput').onkeydown=e=>{ if(e.key==='Enter') e.target.blur(); };
  $('gearBtn').onclick=openSettings;
  let dirty=false;
  function commitDraft(){
    if(!draft) return;
    const i=store.workouts.findIndex(w=>w.id===draft.id);
    if(i<0 && !dirty) return; // untouched new timer: don't save
    draft.name=(draft.name||'').trim()||'New Timer';
    if(draft.work<1) draft.work=1; if(draft.rounds<1) draft.rounds=1;
    if(i>=0) store.workouts[i]=draft; else store.workouts.push(draft);
    store.currentId=draft.id; persist(); dirty=false;
  }
  $('cancelBtn').onclick=()=>{ $('nameInput').blur(); commitDraft(); closeSettings(); };
  $('addBtn').onclick=()=>{
    commitDraft();
    draft={id:'w'+Date.now(), name:'New Timer', work:180, rest:60, rounds:10, colors:{work:'green',rest:'red'}}; dirty=false;
    renderSettings(); $('scroll').scrollTo({top:0,behavior:'smooth'});
    setTimeout(()=>{ $('nameInput').focus(); $('nameInput').select(); },300);
  };
  $('editBtn').onclick=()=>{ deleting=!deleting; $('editBtn').classList.toggle('on',deleting); $('editBtn').textContent=deleting?'Done':'Edit Timers'; renderWorkouts(); };

  /* ---------- picker ---------- */
  let pickKey=null;
  const ITEM=110;
  function fill(el,from,to){
    el.innerHTML=''; el.dataset.from=from;
    for(let i=from;i<=to;i++){ const d=document.createElement('div'); d.textContent=pad(i); d.onclick=()=>setWheel(el,i,true); el.appendChild(d); }
    let raf=null;
    el.addEventListener('scroll',()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=null; paintWheel(el); }); },{passive:true});
    paintWheel(el);
  }
  function paintWheel(el){
    const idx=Math.round(el.scrollTop/ITEM), kids=el.children;
    for(let i=0;i<kids.length;i++){ const d=Math.abs(i-idx); kids[i].className = d===0?'sel':(d===1?'near':''); }
  }
  function setWheel(el,val,smooth){ const idx=val-(+el.dataset.from); el.scrollTo({top:idx*ITEM,behavior:smooth?'smooth':'auto'}); paintWheel(el); }
  function getWheel(el){ return Math.round(el.scrollTop/ITEM)+(+el.dataset.from); }
  fill($('selMin'),0,59); fill($('selSec'),0,59); fill($('selRounds'),1,50);
  $('swatches').innerHTML=Object.keys(COLORS).map(k=>`<div data-c="${k}" style="background:${COLORS[k]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>`).join('');
  $('swatches').querySelectorAll('div').forEach(d=> d.onclick=()=>{ $('swatches').querySelectorAll('div').forEach(x=>x.classList.remove('on')); d.classList.add('on'); });
  function openPicker(key){
    pickKey=key; const f=FIELDS.find(x=>x.key===key);
    $('pTitle').textContent=f.title;
    const isR=f.type==='rounds';
    $('pickTime').classList.toggle('hide',isR); $('pickRounds').classList.toggle('hide',!isR); $('swatches').classList.toggle('hide',isR);
    $('picker').classList.add('on');
    if(isR){ setWheel($('selRounds'),draft.rounds); }
    else { setWheel($('selMin'),Math.floor(draft[key]/60)); setWheel($('selSec'),draft[key]%60); }
  }
  $('pBack').onclick=()=>{
    const f=FIELDS.find(x=>x.key===pickKey); dirty=true;
    if(f.type==='rounds') draft.rounds=getWheel($('selRounds'));
    else { draft[pickKey]=getWheel($('selMin'))*60+getWheel($('selSec')); }
    $('picker').classList.remove('on'); renderSettings();
  };

  /* ---------- init ---------- */
  resetTimer();
})();
</script>
</body>
</html>
